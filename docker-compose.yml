# 장기 앱과 같은 Oracle VM에 함께 올리는 구성. 웹(web/)은 Cloudflare Pages에 따로 배포한다.
# HTTPS는 장기 앱의 caddy가 맡는다. 배포 서버의 .env에서 COMPOSE_FILE로 deploy/compose.janggi.yml을 더한다(docs/deploy.md).
services:
  server:
    # 배포 VM은 GitHub Actions가 만든 이 이미지를 받아 쓴다(deploy/update.sh). 로컬에서는 --build로 직접 만든다.
    image: ghcr.io/orinalgga/memorial-server:latest
    build:
      context: .
      dockerfile: server/Dockerfile
    # 장기 앱 서버가 8080을 쓰므로 8081로 연다. 그 컴퓨터 안에서만 열린다.
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      MEMORIAL_CORS_ALLOWED_ORIGINS: ${MEMORIAL_CORS_ALLOWED_ORIGINS:-http://localhost:5500,http://127.0.0.1:5500,http://localhost:8000}
      DB_URL: jdbc:postgresql://memorial-db:5432/memorial
      DB_USER: memorial
      DB_PASSWORD: ${POSTGRES_PASSWORD:-memorial}
      MEMORIAL_WRITES_PER_MINUTE: ${MEMORIAL_WRITES_PER_MINUTE:-30}
      # 메모리가 작은 VM에서는 .env에 JAVA_TOOL_OPTIONS=-Xmx256m 처럼 힙을 줄인다.
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:-}
    depends_on:
      - memorial-db
    restart: unless-stopped

  # 장기 앱 DB와 섞이지 않도록 추모 앱만의 Postgres를 따로 둔다.
  # 서버는 장기 앱 네트워크에도 붙으므로, 장기 앱의 'postgres'와 겹치지 않는 이름을 쓴다.
  memorial-db:
    image: postgres:16
    environment:
      POSTGRES_DB: memorial
      POSTGRES_USER: memorial
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-memorial}
    # DB 툴(DBeaver 등)은 SSH 터널로 VM의 127.0.0.1:5433에 붙는다. 바깥 인터넷에는 열지 않는다.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
