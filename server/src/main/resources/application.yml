spring:
  application:
    name: memorial-server
  datasource:
    url: ${DB_URL:jdbc:h2:mem:memorial;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  servlet:
    multipart:
      enabled: false

server:
  port: 8080
  # Caddy 같은 프록시 뒤에서도 실제 접속 주소와 IP를 쓴다.
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info

memorial:
  cors:
    # 쉼표로 여러 개. 운영에서는 MEMORIAL_CORS_ALLOWED_ORIGINS로 Cloudflare Pages 주소를 넣는다.
    allowed-origins: ${MEMORIAL_CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:8000}
  limits:
    # 한 IP가 1분에 보낼 수 있는 글쓰기 요청(사연·댓글·채팅·촛불 등) 수.
    writes-per-minute: ${MEMORIAL_WRITES_PER_MINUTE:30}
    # 추모 공간 사진과 얼굴 사진의 최대 크기(바이트). 화면에서 줄여서 보내므로 이 정도면 충분하다.
    photo-bytes: ${MEMORIAL_PHOTO_BYTES:400000}
    face-bytes: ${MEMORIAL_FACE_BYTES:60000}
